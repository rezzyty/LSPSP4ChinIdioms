<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成語保衛戰：憤怒鳥大挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #87CEEB; /* Sky blue background */
            background-image: radial-gradient(circle, #ffffff 10%, transparent 10%), radial-gradient(circle, #ffffff 10%, transparent 10%);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        .angry-font {
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .btn-game {
            background: linear-gradient(to bottom, #ff4d4d, #cc0000);
            border: 3px solid #660000;
            box-shadow: 0 4px 0 #660000, 0 8px 10px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }
        
        .btn-game:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #660000, 0 4px 5px rgba(0,0,0,0.3);
        }

        .btn-option {
            background: linear-gradient(to bottom, #ffffff, #e0e0e0);
            border: 3px solid #666;
            box-shadow: 0 4px 0 #666, 0 5px 10px rgba(0,0,0,0.2);
            color: #333;
            transition: all 0.1s;
        }

        .btn-option:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #666, 0 2px 5px rgba(0,0,0,0.2);
        }

        .btn-option.selected {
            background: linear-gradient(to bottom, #ffff99, #ffcc00);
            border-color: #cc9900;
            box-shadow: 0 4px 0 #cc9900;
        }

        .btn-option.correct {
            background: linear-gradient(to bottom, #a3ffaa, #4dff5e);
            border-color: #009914;
            box-shadow: 0 4px 0 #009914;
        }

        .btn-option.wrong {
            background: linear-gradient(to bottom, #ffa3a3, #ff4d4d);
            border-color: #990000;
            box-shadow: 0 4px 0 #990000;
        }

        .wood-panel {
            background-color: #d2b48c;
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(0,0,0,0.05) 10px,
                rgba(0,0,0,0.05) 20px
            );
            border: 4px solid #8b4513;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.3);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes pulse-coin {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .coin-anim {
            animation: pulse-coin 0.5s ease-in-out;
        }

        @keyframes fly-in {
            0% { transform: translateX(-100vw) rotate(-360deg); opacity: 0; }
            100% { transform: translateX(0) rotate(0deg); opacity: 1; }
        }

        .bird-fly-in {
            animation: fly-in 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* SVG Bird specific styles */
        .bird-svg { width: 100%; height: 100%; }
        
        /* Particle effects for celebration */
        .particle {
            position: absolute;
            pointer-events: none;
            opacity: 0;
        }

        .hidden { display: none !important; }
    </style>
</head>

                    el.innerHTML = `<use href="#${birds[idx]}"></use>${getHatUseTag()}`;
                }
            });
        }

        function renderShop() {
            const grid = document.getElementById('shop-grid');
            if(!grid) return;
            grid.innerHTML = '';
            
            BIRD_TYPES.forEach(birdId => {
                if(birdId === 'bird-red') return; // Default bird is already owned
                
                const isUnlocked = state.unlockedBirds.includes(birdId);
                const data = BIRD_SHOP_DATA[birdId];
                if(!data) return;

                const price = data.price;
                const canBuy = state.coins >= price.coins && state.gems >= price.gems && state.pearls >= price.pearls && state.leaves >= price.leaves;

                const itemDiv = document.createElement('div');
                itemDiv.className = `wood-panel rounded-xl flex flex-col items-center justify-between p-3 relative`;
                
                let btnHTML = '';
                if (isUnlocked) {
                    btnHTML = `<button class="w-full mt-3 py-2 bg-gray-400 text-white rounded font-bold cursor-not-allowed border-b-4 border-gray-500 text-sm" disabled>已擁有</button>`;
                } else {
                    btnHTML = `<button class="w-full mt-3 py-2 text-white rounded font-bold border-b-4 transition-transform active:translate-y-1 active:border-b-0 text-sm ${canBuy ? 'bg-green-500 hover:bg-green-400 border-green-700 cursor-pointer' : 'bg-gray-400 border-gray-500 cursor-not-allowed'}" onclick="buyBird('${birdId}', event)" ${canBuy ? '' : 'disabled'}>購買</button>`;
                }

                itemDiv.innerHTML = `
                    <div class="w-16 h-16 sm:w-20 sm:h-20 mb-2">
                        <svg viewBox="0 0 100 100" class="w-full h-full"><use href="#${birdId}"></use></svg>
                    </div>
                    <h4 class="font-bold text-gray-800 text-center text-sm">${data.name}</h4>
                    ${!isUnlocked ? renderPrice(price) : '<div class="text-green-700 font-bold mt-2 h-10 flex items-center text-sm">✓ 解鎖完成</div>'}
                    ${btnHTML}
                `;
                grid.appendChild(itemDiv);
            });

            // Add Hats to shop
            HATS_DATA.forEach(hat => {
                const isUnlocked = state[`${hat.id}HatUnlocked`];
                const price = hat.price;
                const canBuy = state.coins >= price.coins && state.gems >= price.gems && state.pearls >= price.pearls && state.leaves >= price.leaves;
                
                const hatDiv = document.createElement('div');
                hatDiv.className = `wood-panel rounded-xl flex flex-col items-center justify-between p-3 relative ${hat.colorClass}`;
                
                let hatBtnHTML = '';
                if (isUnlocked) {
                    hatBtnHTML = `<button class="w-full mt-3 py-2 bg-gray-400 text-white rounded font-bold cursor-not-allowed border-b-4 border-gray-500 text-sm" disabled>已擁有</button>`;
                } else {
                    hatBtnHTML = `<button class="w-full mt-3 py-2 text-white rounded font-bold border-b-4 transition-transform active:translate-y-1 active:border-b-0 text-sm ${canBuy ? hat.btnClass + ' cursor-pointer' : 'bg-gray-400 border-gray-500 cursor-not-allowed'}" onclick="buyHat('${hat.id}', event)" ${canBuy ? '' : 'disabled'}>購買</button>`;
                }
                
                hatDiv.innerHTML = `
                    <div class="w-16 h-16 sm:w-20 sm:h-20 mb-2 relative" id="shop-hat-${hat.id}">
                        <svg viewBox="0 0 100 100" class="w-full h-full absolute opacity-40"><use href="#bird-red"></use></svg>
                        <svg viewBox="0 0 100 100" class="w-full h-full absolute z-10"><use href="#hat-${hat.id}"></use></svg>
                    </div>
                    <h4 class="font-bold ${hat.textClass} text-center text-sm">${hat.name} (配件)</h4>
                    ${!isUnlocked ? renderPrice(price) : '<div class="text-green-700 font-bold mt-2 h-10 flex items-center text-sm">✓ 解鎖完成</div>'}
                    ${hatBtnHTML}
                `;
                grid.appendChild(hatDiv);
            });
        }

        function buyHat(hatId, event) {
            const hat = HATS_DATA.find(h => h.id === hatId);
            if (!hat) return;
            const price = hat.price;
            if (state.coins >= price.coins && state.gems >= price.gems && state.pearls >= price.pearls && state.leaves >= price.leaves) {
                state.coins -= price.coins;
                state.gems -= price.gems;
                state.pearls -= price.pearls;
                state.leaves -= price.leaves;
                
                state[`${hatId}HatUnlocked`] = true;
                state.equippedHat = hatId;
                
                localStorage.setItem(`idiom${hatId.charAt(0).toUpperCase() + hatId.slice(1)}Hat`, 'true');
                localStorage.setItem('idiomEquippedHat', hatId);
                
                updateHUD();
                renderShop();
                populateCollection();
                updateGlobalHats();
                
                if(event && event.target) {
                    createParticles(event.target.getBoundingClientRect());
                }
            }
        }

        function renderPrice(price) {
            let html = '<div class="flex flex-wrap justify-center gap-x-2 gap-y-1 mt-2 h-10 items-center">';
            if(price.coins > 0) html += `<div class="flex items-center gap-1 text-xs font-bold text-yellow-900"><svg class="w-3 h-3 sm:w-4 sm:h-4"><use href="#icon-coin"></use></svg>${price.coins}</div>`;
            if(price.gems > 0) html += `<div class="flex items-center gap-1 text-xs font-bold text-cyan-900"><svg class="w-3 h-3 sm:w-4 sm:h-4"><use href="#icon-gem"></use></svg>${price.gems}</div>`;
            if(price.pearls > 0) html += `<div class="flex items-center gap-1 text-xs font-bold text-pink-900"><svg class="w-3 h-3 sm:w-4 sm:h-4"><use href="#icon-pearl"></use></svg>${price.pearls}</div>`;
            if(price.leaves > 0) html += `<div class="flex items-center gap-1 text-xs font-bold text-green-900"><svg class="w-3 h-3 sm:w-4 sm:h-4"><use href="#icon-leaf"></use></svg>${price.leaves}</div>`;
            html += '</div>';
            return html;
        }

        function buyBird(birdId, event) {
            const data = BIRD_SHOP_DATA[birdId];
            if(!data) return;
            const price = data.price;
            
            if (state.coins >= price.coins && state.gems >= price.gems && state.pearls >= price.pearls && state.leaves >= price.leaves) {
                // Deduct currencies
                state.coins -= price.coins;
                state.gems -= price.gems;
                state.pearls -= price.pearls;
                state.leaves -= price.leaves;
                
                // Unlock bird
                state.unlockedBirds.push(birdId);
                
                // Update UI immediately
                updateHUD();
                populateCollection();
                renderShop();
                
                // Particle celebration effect
                if(event && event.target) {
                    const rect = event.target.getBoundingClientRect();
                    createParticles(rect);
                }
            }
        }

        function init() {
            updateHUD();
            populateCollection();
            renderShop();
            updateGlobalHats();
            
            // Restore session UI after hot-reloads
            if (state.currentScreen === 'game' && state.questions && state.questions.length > 0) {
                showScreen('game');
                loadQuestion();
            } else if (state.currentScreen === 'exercise-select' || state.currentScreen === 'result') {
                if (state.currentSet) {
                    startSet(state.currentSet);
                } else {
                    showScreen('home');
                }
            } else {
                showScreen(state.currentScreen || 'home');
            }
        }

        function updateHUD() {
            const coinEl = document.getElementById('coin-display');
            const gemEl = document.getElementById('gem-display');
            const pearlEl = document.getElementById('pearl-display');
            const leafEl = document.getElementById('leaf-display');
            
            if(coinEl.innerText !== state.coins.toString()) {
                coinEl.innerText = state.coins;
                coinEl.parentElement.classList.add('coin-anim');
                setTimeout(() => coinEl.parentElement.classList.remove('coin-anim'), 500);
            }
            
            if(gemEl.innerText !== state.gems.toString()) {
                gemEl.innerText = state.gems;
                gemEl.parentElement.classList.add('coin-anim');
                setTimeout(() => gemEl.parentElement.classList.remove('coin-anim'), 500);
            }

            if(pearlEl.innerText !== state.pearls.toString()) {
                pearlEl.innerText = state.pearls;
                pearlEl.parentElement.classList.add('coin-anim');
                setTimeout(() => pearlEl.parentElement.classList.remove('coin-anim'), 500);
            }

            if(leafEl.innerText !== state.leaves.toString()) {
                leafEl.innerText = state.leaves;
                leafEl.parentElement.classList.add('coin-anim');
                setTimeout(() => leafEl.parentElement.classList.remove('coin-anim'), 500);
            }

            localStorage.setItem('idiomCoins', state.coins);
            localStorage.setItem('idiomGems', state.gems);
            localStorage.setItem('idiomPearls', state.pearls);
            localStorage.setItem('idiomLeaves', state.leaves);
            localStorage.setItem('idiomBirds', JSON.stringify(state.unlockedBirds));
            
            if (typeof saveData === 'function') saveData();
        }

        function showScreen(screenName) {
            ['home', 'collection', 'game', 'exercise-select', 'result', 'shop'].forEach(s => {
                const el = document.getElementById(`screen-${s}`);
                if(el) el.classList.add('hidden');
            });
            document.getElementById(`screen-${screenName}`).classList.remove('hidden');
            
            const btnBack = document.getElementById('btn-back');
            const hudSpacer = document.getElementById('hud-spacer');
            
            if (screenName === 'home') {
                btnBack.classList.add('hidden');
                hudSpacer.classList.remove('hidden');
                btnBack.onclick = () => showScreen('home'); // Reset back action
            } else {
                btnBack.classList.remove('hidden');
                hudSpacer.classList.add('hidden');
                
                // Specific back actions depending on current screen
                if (screenName === 'exercise-select') {
                    btnBack.onclick = () => showScreen('home');
                } else if (screenName === 'game') {
                    btnBack.onclick = () => showScreen('exercise-select');
                } else if (screenName === 'collection' || screenName === 'shop') {
                    btnBack.onclick = () => showScreen('home');
                } else if (screenName === 'result') {
                    btnBack.onclick = () => showScreen('exercise-select');
                }
            }
            
            if (screenName === 'shop') renderShop();
            
            state.currentScreen = screenName;
            saveSession();
            window.scrollTo(0, 0); // Reset scroll position for screens like result
        }

        function populateCollection() {
            const grid = document.getElementById('collection-grid');
            grid.innerHTML = '';
            
            const unlockedHatsCount = ['cat', 'dog', 'transformer', 'shades'].filter(id => state[`${id}HatUnlocked`]).length;

            if (unlockedHatsCount > 0) {
                const toggleDiv = document.createElement('div');
                toggleDiv.className = 'col-span-full flex flex-col items-center mb-6 wood-panel p-4 rounded-xl';
                
                let buttonsHTML = `<div class="flex flex-wrap justify-center gap-3 w-full">`;
                
                // No hat button
                buttonsHTML += `<button class="btn-game rounded-full py-2 px-6 text-white font-bold flex flex-col items-center gap-1 transition-transform active:translate-y-1 ${state.equippedHat === 'none' ? 'ring-4 ring-yellow-400 scale-105' : 'opacity-70'}" onclick="equipHat('none')" style="background: linear-gradient(to bottom, #9ca3af, #4b5563)">
                    <span class="text-lg angry-font">無帽子</span>
                </button>`;

                HATS_DATA.forEach(hat => {
                    if (state[`${hat.id}HatUnlocked`]) {
                        buttonsHTML += `<button class="btn-game rounded-full py-2 px-6 text-white font-bold flex flex-col items-center gap-1 transition-transform active:translate-y-1 ${state.equippedHat === hat.id ? 'ring-4 ring-yellow-400 scale-105' : 'opacity-70'}" onclick="equipHat('${hat.id}')" style="background: linear-gradient(to bottom, #22c55e, #16a34a)">
                            <svg viewBox="0 0 100 100" class="w-8 h-8 drop-shadow-md"><use href="#hat-${hat.id}"></use></svg>
                            <span class="text-lg angry-font">${hat.name}</span>
                        </button>`;
                    }
                });
                
                buttonsHTML += `</div>`;
                
                toggleDiv.innerHTML = `
                    <h4 class="angry-font text-yellow-900 text-xl mb-3">更換裝備</h4>
                    ${buttonsHTML}
                `;
                grid.appendChild(toggleDiv);
            }

            BIRD_TYPES.forEach(birdId => {
                const isUnlocked = state.unlockedBirds.includes(birdId);
                const birdDiv = document.createElement('div');
                birdDiv.className = `wood-panel rounded-xl aspect-square flex flex-col items-center justify-center p-2 relative overflow-hidden ${isUnlocked ? '' : 'grayscale opacity-50'}`;
                
                if (!isUnlocked) {
                    birdDiv.innerHTML = `<div class="absolute inset-0 flex items-center justify-center text-5xl text-gray-800 font-bold opacity-30 z-30">?</div>`;
                }

                let hatSVG = '';
                if (isUnlocked && state.equippedHat !== 'none') {
                    hatSVG = `<svg viewBox="0 0 100 100" class="w-full h-full absolute top-2 left-0 z-20 pointer-events-none drop-shadow-md"><use href="#hat-${state.equippedHat}"></use></svg>`;
                }

                birdDiv.innerHTML += `<svg viewBox="0 0 100 100" class="w-full h-full z-10"><use href="#${birdId}"></use></svg>${hatSVG}`;
                grid.appendChild(birdDiv);
            });
        }

        function equipHat(hatId) {
            state.equippedHat = hatId;
            localStorage.setItem('idiomEquippedHat', hatId);
            populateCollection();
            updateGlobalHats();
            if (typeof saveData === 'function') saveData();
        }

        function unlockRandomBird() {
            const lockedBirds = BIRD_TYPES.filter(b => !state.unlockedBirds.includes(b));
            if (lockedBirds.length > 0) {
                const newBird = lockedBirds[Math.floor(Math.random() * lockedBirds.length)];
                state.unlockedBirds.push(newBird);
                populateCollection();
                if (typeof saveData === 'function') saveData();
                return newBird;
            }
            return null;
        }

        function getRandomUnlockedBird() {
            return state.unlockedBirds[Math.floor(Math.random() * state.unlockedBirds.length)];
        }

        function startSet(setNum) {
            state.currentSet = setNum;
            
            const setData = exerciseData[setNum];
            document.getElementById('exercise-set-title').innerText = setData.title;
            
            const idiomListContainer = document.getElementById('exercise-idiom-list');
            idiomListContainer.innerHTML = '';
            if (setIdioms[setNum]) {
                setIdioms[setNum].forEach(idiom => {
                    const span = document.createElement('span');
                    span.className = "bg-white px-2 py-1 rounded border border-gray-300 text-sm";
                    span.innerText = idiom;
                    idiomListContainer.appendChild(span);
                });
            }

            const grid = document.getElementById('exercise-grid');
            grid.innerHTML = '';
            
            saveSession();
            
            // Populate the 8 exercises for the selected set
            for (let i = 1; i <= 8; i++) {
                const btn = document.createElement('button');
                btn.className = 'btn-game wood-panel rounded-2xl p-4 flex flex-col items-center justify-center gap-2 h-24';
                btn.onclick = () => startExercise(i);
                
                btn.innerHTML = `
                    <span class="angry-font text-white text-xl">練習 ${['一','二','三','四','五','六','七','八'][i-1]}</span>
                    <span class="text-white text-xs font-bold">${setData.exercises[i].length} 題</span>
                `;
                grid.appendChild(btn);
            }
            
            showScreen('exercise-select');
        }

        function startExercise(exerciseNum) {
            state.currentExercise = exerciseNum;
            state.questions = [...exerciseData[state.currentSet].exercises[exerciseNum]];
            
            // Store original total length before potential shuffling or modification
            state.totalQuestions = state.questions.length;
            
            // Shuffle questions for varied gameplay
            state.questions.sort(() => Math.random() - 0.5);
            state.currentQuestionIndex = 0;
            state.score = 0;
            state.streak = 0;
            state.userAnswers = []; // Reset user answers for the new round
            
            saveSession();
            
            document.getElementById('feedback-overlay').classList.add('hidden');
            
            showScreen('game');
            loadQuestion();
        }

        function loadQuestion() {
            const qData = state.questions[state.currentQuestionIndex];
            
            // Update Progress using actual total questions in the exercise
            const total = state.totalQuestions;
            const progressPct = (state.currentQuestionIndex / total) * 100;
            document.getElementById('progress-bar').style.width = `${progressPct}%`;
            document.getElementById('progress-text').innerText = `${state.currentQuestionIndex + 1} / ${total}`;

            // Setup Battlefield
            const birdId = getRandomUnlockedBird();
            const birdSvg = document.getElementById('current-bird-svg');
            birdSvg.innerHTML = `<use href="#${birdId}"></use>`;
            
            if (state.equippedHat !== 'none') {
                birdSvg.innerHTML += `<use href="#hat-${state.equippedHat}"></use>`;
            }
            
            // Reset animations
            birdSvg.classList.remove('bird-fly-in');
            void birdSvg.offsetWidth; // trigger reflow
            birdSvg.classList.add('bird-fly-in');
            
            const enemy = document.getElementById('enemy-container');
            enemy.style.transform = 'translateY(0) rotate(0deg) scale(1)';
            enemy.style.opacity = '1';

            // Setup Question
            document.getElementById('question-text').innerHTML = qData.q.replace('__________', '<span class="inline-block w-24 border-b-2 border-gray-800"></span>');

            // Setup Options
            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';
            
            // Shuffle options
            const options = [...qData.options].sort(() => Math.random() - 0.5);
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-option rounded-xl py-4 px-2 angry-font text-lg md:text-xl w-full';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                optsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedOpt, btnEl) {
            const opts = document.getElementById('options-container').querySelectorAll('button');
            opts.forEach(b => b.disabled = true); // Disable all buttons
            
            const qData = state.questions[state.currentQuestionIndex];
            const isCorrect = selectedOpt === qData.a;
            
            // Record answer for review
            state.userAnswers.push({
                question: qData.q,
                selected: selectedOpt,
                correct: qData.a,
                isCorrect: isCorrect
            });
            
            saveSession();
            
            btnEl.classList.add(isCorrect ? 'correct' : 'wrong');
            
            const enemy = document.getElementById('enemy-container');
            const birdSvg = document.getElementById('current-bird-svg');
            
            if (isCorrect) {
                state.score++;
                state.streak++;
                
                // Bird Attack Animation
                birdSvg.style.transition = 'transform 0.4s cubic-bezier(0.5, 0, 1, 1)';
                birdSvg.style.transform = `translate(calc(100vw - 200px), -50px) rotate(360deg)`;
                
                // Pig Defeat Animation
                setTimeout(() => {
                    enemy.style.transition = 'all 0.5s';
                    enemy.style.transform = 'translateY(100px) rotate(180deg) scale(0)';
                    enemy.style.opacity = '0';
                    createParticles(enemy.getBoundingClientRect());
                }, 300);

                setTimeout(() => showFeedback(true), 800);
            } else {
                state.streak = 0;
                
                // Bird Fail Animation (falls down)
                birdSvg.style.transition = 'transform 0.5s ease-in';
                birdSvg.style.transform = `translateY(100px) rotate(-90deg)`;
                
                // Pig Laugh Animation (simple jump)
                enemy.style.transition = 'transform 0.2s';
                enemy.style.transform = 'translateY(-20px)';
                setTimeout(() => enemy.style.transform = 'translateY(0)', 200);
                setTimeout(() => enemy.style.transform = 'translateY(-20px)', 400);
                setTimeout(() => enemy.style.transform = 'translateY(0)', 600);

                setTimeout(() => showFeedback(false, qData.a), 1000);
            }
        }

        function showFeedback(isCorrect, correctAnswer = "") {
            const overlay = document.getElementById('feedback-overlay');
            const panel = document.getElementById('feedback-panel');
            const title = document.getElementById('feedback-title');
            const rewardCoins = document.getElementById('reward-coins');
            const rewardGem = document.getElementById('reward-gem-container');
            const rewardPearl = document.getElementById('reward-pearl-container');
            const rewardLeaf = document.getElementById('reward-leaf-container');
            
            overlay.classList.remove('hidden');
            // Trigger animation
            panel.classList.remove('scale-0');
            panel.classList.add('scale-100');
            
            rewardGem.classList.add('hidden');
            rewardPearl.classList.add('hidden');
            rewardLeaf.classList.add('hidden');

            if (isCorrect) {
                title.innerText = "正確!";
                title.className = "angry-font text-5xl mb-4 text-green-400";
                
                let coinsEarned = 10 + (state.streak > 1 ? 5 : 0); // Bonus for streak
                state.coins += coinsEarned;
                rewardCoins.innerText = `+${coinsEarned}`;
                
                // Chance for gem if streak is high
                if (state.streak >= 3 && Math.random() > 0.5) {
                    state.gems += 1;
                    rewardGem.classList.remove('hidden');
                }
                
                // Chance for pearl if streak is very high
                if (state.streak >= 5 && Math.random() > 0.7) {
                    state.pearls += 1;
                    rewardPearl.classList.remove('hidden');
                }

                // Chance for leaf if streak is >= 2
                if (state.streak >= 2 && Math.random() > 0.4) {
                    state.leaves += 1;
                    rewardLeaf.classList.remove('hidden');
                }
            } else {
                title.innerHTML = `錯誤!<br><span class="text-2xl mt-2 block text-gray-200">正確答案: ${correctAnswer}</span>`;
                title.className = "angry-font text-5xl mb-4 text-red-500 text-center";
                
                state.coins += 2; // consolation prize
                rewardCoins.innerText = "+2";
            }
            
            updateHUD();
        }

        function nextQuestion() {
            const overlay = document.getElementById('feedback-overlay');
            const panel = document.getElementById('feedback-panel');
            
            panel.classList.remove('scale-100');
            panel.classList.add('scale-0');
            
            setTimeout(() => {
                overlay.classList.add('hidden');
                
                state.currentQuestionIndex++;
                saveSession();
                
                if (state.currentQuestionIndex < state.totalQuestions) {
                    loadQuestion();
                } else {
                    showEndScreen();
                }
            }, 300);
        }

        function showEndScreen() {
            const total = state.totalQuestions;
            
            // Final Progress Update
            document.getElementById('progress-bar').style.width = `100%`;
            document.getElementById('progress-text').innerText = `${total} / ${total}`;

            // Show result screen
            showScreen('result');

            const starsContainer = document.getElementById('result-stars');
            const scoreText = document.getElementById('result-score');
            const newBirdAlert = document.getElementById('new-bird-alert');
            const newBirdSvg = document.getElementById('unlocked-bird-svg');
            const reviewList = document.getElementById('review-list');
            
            scoreText.innerText = `得分: ${state.score} / ${total}`;
            
            // Calculate stars (3 max based on percentage)
            let stars = 0;
            const scorePct = state.score / total;
            if (scorePct === 1) stars = 3; // 100%
            else if (scorePct >= 0.7) stars = 2; // ~70%+
            else if (scorePct >= 0.4) stars = 1; // ~40%+
            
            starsContainer.innerHTML = '';
            for(let i=0; i<3; i++) {
                const star = document.createElement('div');
                star.innerHTML = `<svg viewBox="0 0 100 100" class="w-16 h-16 ${i < stars ? '' : 'grayscale opacity-30'} pop-in" style="animation-delay: ${i*0.2}s">
                    <polygon points="50,10 61,39 92,39 67,58 76,89 50,71 24,89 33,58 8,39 39,39" fill="#ffcc00" stroke="#cc9900" stroke-width="2"/>
                </svg>`;
                starsContainer.appendChild(star);
            }

            // Big rewards
            const coinsEarned = state.score * 5;
            let gemsEarned = 0;
            let pearlsEarned = 0;
            let leavesEarned = 0;
            
            if (stars === 3) {
                gemsEarned = 2;
                pearlsEarned = 1; // Guaranteed pearl for perfect score
                leavesEarned = 5; // Bonus leaves for perfect score
            }
            else if (stars >= 1) {
                gemsEarned = 1;
                leavesEarned = stars * 2;
            }
            
            state.coins += coinsEarned;
            state.gems += gemsEarned;
            state.pearls += pearlsEarned;
            state.leaves += leavesEarned;
            
            // Show rewards earned
            document.getElementById('result-coins-earned').innerText = `+${coinsEarned}`;
            const gemContainer = document.getElementById('result-gem-container');
            if (gemsEarned > 0) {
                gemContainer.classList.remove('hidden');
                document.getElementById('result-gems-earned').innerText = `+${gemsEarned}`;
            } else {
                gemContainer.classList.add('hidden');
            }
            
            const pearlContainer = document.getElementById('result-pearl-container');
            if (pearlsEarned > 0) {
                pearlContainer.classList.remove('hidden');
                document.getElementById('result-pearls-earned').innerText = `+${pearlsEarned}`;
            } else {
                pearlContainer.classList.add('hidden');
            }
            
            const leafContainer = document.getElementById('result-leaf-container');
            if (leavesEarned > 0) {
                leafContainer.classList.remove('hidden');
                document.getElementById('result-leaves-earned').innerText = `+${leavesEarned}`;
            } else {
                leafContainer.classList.add('hidden');
            }
            
            updateHUD();
            newBirdAlert.classList.add('hidden');

            // Populate Review List
            reviewList.innerHTML = '';
            state.userAnswers.forEach((ans, idx) => {
                const item = document.createElement('div');
                item.className = `p-4 rounded-xl border-2 ${ans.isCorrect ? 'bg-green-100 border-green-400' : 'bg-red-100 border-red-400'}`;
                
                // Replace __________ with the answer text
                let qText = ans.question.replace('__________', `<span class="font-bold underline ${ans.isCorrect ? 'text-green-700' : 'text-red-600'}">${ans.selected}</span>`);
                
                let explanationHTML = '';
                if (!ans.isCorrect) {
                    explanationHTML = `<div class="mt-2 text-sm font-bold text-gray-700">正確答案：<span class="text-green-600">${ans.correct}</span></div>`;
                }

                item.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="font-bold text-lg w-6 flex-shrink-0 text-gray-700">${idx + 1}.</div>
                        <div class="flex-grow">
                            <p class="text-gray-900 text-lg leading-relaxed font-medium">${qText}</p>
                            ${explanationHTML}
                        </div>
                        <div class="ml-auto text-3xl font-bold ${ans.isCorrect ? 'text-green-500' : 'text-red-500'}">
                            ${ans.isCorrect ? '✓' : '✗'}
                        </div>
                    </div>
                `;
                reviewList.appendChild(item);
            });

            // Unlock bird logic (e.g., if passing with >= 70%)
            if (scorePct >= 0.7) {
                const unlocked = unlockRandomBird();
                if (unlocked) {
                    setTimeout(() => {
                        newBirdSvg.innerHTML = `<use href="#${unlocked}"></use>`;
                        if (state.equippedHat !== 'none') {
                            newBirdSvg.innerHTML += `<use href="#hat-${state.equippedHat}"></use>`;
                        }
                        newBirdAlert.classList.remove('hidden');
                    }, 1000);
                }
            }
        }

        function createParticles(rect) {
            const colors = ['#77cc33', '#559922', '#ffffff'];
            for(let i=0; i<15; i++) {
                const p = document.createElement('div');
                p.className = 'particle w-3 h-3 rounded-full absolute z-50';
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                const startX = rect.left + rect.width/2;
                const startY = rect.top + rect.height/2;
                
                p.style.left = startX + 'px';
                p.style.top = startY + 'px';
                
                document.body.appendChild(p);
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 50 + Math.random() * 100;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                p.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 500 + Math.random() * 300,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                }).onfinish = () => p.remove();
            }
        }

        // Parent Admin Hidden Functions
        let secretClickCount = 0;
        let secretClickTimer;

        window.handleSecretClick = function() {
            secretClickCount++;
            clearTimeout(secretClickTimer);
            // Reset click count if they stop clicking for 1 second
            secretClickTimer = setTimeout(() => secretClickCount = 0, 1000);
            
            if (secretClickCount >= 5) {
                window.openAdminModal();
                secretClickCount = 0; // Reset after opening
            }
        };

        window.openAdminModal = function() {
            document.getElementById('admin-modal').classList.remove('hidden');
            document.getElementById('admin-login-panel').classList.remove('hidden');
            document.getElementById('admin-unlocked-panel').classList.add('hidden');
            document.getElementById('admin-error').classList.add('hidden');
            document.getElementById('admin-pin').value = '';
        };

        window.closeAdminModal = function() {
            document.getElementById('admin-modal').classList.add('hidden');
        };

        window.verifyAdminPin = function() {
            const pin = document.getElementById('admin-pin').value;
            if (pin === '8888') {
                document.getElementById('admin-login-panel').classList.add('hidden');
                document.getElementById('admin-unlocked-panel').classList.remove('hidden');
            } else {
                document.getElementById('admin-error').classList.remove('hidden');
            }
        };

        window.adminAddCurrency = function(type, amount) {
            state[type] += amount;
            updateHUD();
        };

        // Expose globally for inline event handlers
        window.showScreen = showScreen;
        window.startSet = startSet;
        window.startExercise = startExercise;
        window.nextQuestion = nextQuestion;
        window.buyHat = buyHat;
        window.buyBird = buyBird;
        window.equipHat = equipHat;

        // Firebase Initialization
        async function initFirebase() {
            if (Object.keys(firebaseConfig).length === 0) {
                init();
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                userId = auth.currentUser?.uid;
                
                if (userId) {
                    document.getElementById('user-id-display').innerText = `ID: ${userId}`;
                    document.getElementById('user-info').classList.remove('hidden');
                    await loadData();
                }
            } catch (error) {
                console.error("Firebase auth/init error:", error);
            }
            init(); // Start game
        }

        async function loadData() {
            if (!userId || !db) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'playerState', 'data');
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    state.coins = data.coins ?? state.coins;
                    state.gems = data.gems ?? state.gems;
                    state.pearls = data.pearls ?? state.pearls;
                    state.leaves = data.leaves ?? state.leaves;
                    if (data.unlockedBirds) state.unlockedBirds = data.unlockedBirds;
                    state.catHatUnlocked = data.catHatUnlocked || false;
                    state.dogHatUnlocked = data.dogHatUnlocked || false;
                    state.transformerHatUnlocked = data.transformerHatUnlocked || false;
                    state.shadesHatUnlocked = data.shadesHatUnlocked || false;
                    state.equippedHat = data.equippedHat || 'none';
                }
            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        async function saveData() {
            if (!userId || !db) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'playerState', 'data');
                await setDoc(docRef, {
                    coins: state.coins,
                    gems: state.gems,
                    pearls: state.pearls,
                    leaves: state.leaves,
                    unlockedBirds: state.unlockedBirds,
                    catHatUnlocked: state.catHatUnlocked,
                    dogHatUnlocked: state.dogHatUnlocked,
                    transformerHatUnlocked: state.transformerHatUnlocked,
                    shadesHatUnlocked: state.shadesHatUnlocked,
                    equippedHat: state.equippedHat
                });
            } catch (error) {
                console.error("Error saving data:", error);
            }
        }

        // Initialize on load
        window.onload = initFirebase;
    </script>
</body>
</html>
